[package]
name = "matehub-chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Async runtime & networking
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
futures-util.workspace = true
fastwebsockets.workspace = true

# ScyllaDB
scylla.workspace = true

# Pub/Sub
async-nats.workspace = true

# Redis (presence, read state, rate limiting)
redis.workspace = true

# Postgres: chat reads channels.type + dm_participants + group permissions
# straight from the hub-service database for the access::check enforcement
# layer. Source of truth lives in hub; chat is a read-only consumer.
sqlx.workspace = true

# Auth
jsonwebtoken.workspace = true

# IDs
uuid.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utils
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
dotenvy.workspace = true
matehub-common.workspace = true
rand.workspace = true
axum-extra = { version = "0.10", features = ["multipart"] }

# Image processing (dimensions + thumbnails)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# HTTP client for S3 streaming proxy
reqwest.workspace = true
bytes.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
# Tests need real ACL data (channels, dm_participants, group perms) — easiest
# is to bring up the hub schema + dev seed via the hub crate itself.
matehub-hub = { path = "../hub" }
