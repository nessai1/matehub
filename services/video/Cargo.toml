[package]
name = "matehub-video"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# WebRTC
str0m.workspace = true

# Async runtime & networking
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true

# Concurrency
parking_lot.workspace = true
# Cross-thread channel (tokio WS handlers → dedicated media thread).
# tokio::sync::mpsc is async-only; we need a thread-safe sync sender.
crossbeam.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
matehub-common.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# NATS — used to publish "voice occupancy" join/leave events so the hub
# service can fan them out to presence-WS subscribers.
async-nats.workspace = true

# Utils
uuid.workspace = true
bytes.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures-util.workspace = true
socket2.workspace = true
# libc is pulled in solely for MSG_DONTWAIT — needed by per-send non-blocking
# UDP writes so kernel send-buf back-pressure can't stall the media thread.
libc = "0.2"

# Optional: in-process CPU profiler exposed via /debug/pprof/profile when the
# `profiling` feature is enabled. Off by default so production builds carry
# no extra deps; turn on for load-test sessions.
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

# Allocator — default glibc malloc is a noticeable tax at high packet rates
# (str0m does allocate on hot paths). mimalloc is pure-Rust, no ffi system
# deps, and typically 10-20% faster throughput for SFU workloads.
mimalloc = { version = "0.1", default-features = false }

# Enumerate local interfaces — we advertise every non-loopback IP as a host
# candidate so ICE nomination doesn't fall back to peer-reflexive.
if-addrs = "0.14"

[dev-dependencies]
pretty_assertions.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
serde_json.workspace = true
criterion.workspace = true

[features]
default = []
# Enable in-process CPU profiling at /debug/pprof/profile. Adds the `pprof`
# crate. Use for load-test investigations only — leave off in production.
profiling = ["dep:pprof"]

[[bench]]
name = "sfu_forward"
harness = false
