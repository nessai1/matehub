# MateHub box -- single-VPS deployment, images pulled from a registry.
#
# Used both for our own stands (demo, staging, prod-single-tenant) and for
# self-hosted installations -- the difference is just REGISTRY_URL in .env
# (your private CR vs. our public mirror).
#
# K8s/SaaS deployments (deploy/helm) pull THE SAME images from THE SAME
# registry. There is no "box-only" or "saas-only" image variant.
#
# Usage:
#   1. cp .env.box.example .env  &&  fill in DOMAIN / PUBLIC_IP / ACME_EMAIL
#   2. docker login --username json_key --password-stdin cr.yandex < puller.json
#      (skip if REGISTRY_URL points at a public registry)
#   3. ./scripts/box-deploy.sh
#
# Updating one service:
#   - bump <SERVICE>_VERSION in .env (e.g. CHAT_VERSION=0.1.1)
#   - docker compose pull chat && docker compose up -d chat

name: matehub-box

networks:
  matehub:
    driver: bridge

volumes:
  pg-data:
  scylla-data:
  redis-data:
  nats-data:
  minio-data:
  caddy-data:
  caddy-config:

services:
  # ── Infrastructure ────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: matehub
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matehub"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [matehub]

  scylla:
    image: scylladb/scylla:6.2
    restart: unless-stopped
    command: >
      --smp 1
      --memory 768M
      --overprovisioned 1
      --developer-mode 1
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select now() from system.local' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [matehub]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [matehub]

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [matehub]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [matehub]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/hub-assets &&
      mc mb --ignore-existing local/chat-media &&
      mc anonymous set download local/hub-assets &&
      mc anonymous set download local/chat-media &&
      echo 'minio buckets ready'
      "
    restart: "no"
    networks: [matehub]

  # ── Application services (pulled from Yandex CR) ──────────────────
  hub:
    image: ${REGISTRY_URL}/matehub-hub:${HUB_VERSION}
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PORT: "3002"
      STATIC_DIR: /srv/dist
      DATABASE_URL: postgresql://matehub:${POSTGRES_PASSWORD}@postgres:5432/matehub
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      DEV_MODE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_HUB_ASSETS: hub-assets
      # Surfaced to the SPA via GET /config.json so a single hub image
      # works against any TURN deployment without a rebuild.
      TURN_URL: ${TURN_URL}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [matehub]

  chat:
    image: ${REGISTRY_URL}/matehub-chat:${CHAT_VERSION}
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      CHAT_PORT: "3003"
      SCYLLA_URL: scylla:9042
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      HUB_DATABASE_URL: postgresql://matehub:${POSTGRES_PASSWORD}@postgres:5432/matehub
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_CHAT_MEDIA: chat-media
    depends_on:
      scylla:   { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      nats:     { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [matehub]

  video:
    image: ${REGISTRY_URL}/matehub-video:${VIDEO_VERSION}
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HTTP_PORT: "4000"
      UDP_PORT: "4001"
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_IP: ${PUBLIC_IP}
    ports:
      # SFU media. Caddy can't proxy UDP, so this port is mapped straight
      # to the host -- has to be reachable from the open internet.
      - "4001:4001/udp"
    depends_on:
      nats: { condition: service_healthy }
    networks: [matehub]

  transcoder:
    image: ${REGISTRY_URL}/matehub-transcoder:${TRANSCODER_VERSION}
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_CHAT_MEDIA: chat-media
    depends_on:
      nats: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [matehub]

  # ── TURN ──────────────────────────────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --realm=${DOMAIN}
      --listening-port=3478
      --min-port=49152
      --max-port=65535
      --external-ip=${PUBLIC_IP}
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME}:${TURN_PASSWORD}
      --no-tls
      --no-dtls
      --no-cli
      --log-file=stdout

  # ── Edge ──────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      hub:   { condition: service_started }
      chat:  { condition: service_started }
      video: { condition: service_started }
    networks: [matehub]
