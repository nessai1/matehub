apiVersion: apps/v1
kind: Deployment
metadata:
  name: matehub-general
  labels:
    app: matehub-general
    {{- include "matehub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.general.replicaCount }}
  selector:
    matchLabels:
      app: matehub-general
  template:
    metadata:
      labels:
        app: matehub-general
    spec:
      containers:
        - name: general
          image: {{ include "matehub.image" (dict "global" .Values.global "image" .Values.general.image) }}
          ports:
            - name: http
              containerPort: {{ .Values.general.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.general.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.general.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: matehub-general
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.general.service.port }}
      targetPort: http
  selector:
    app: matehub-general
