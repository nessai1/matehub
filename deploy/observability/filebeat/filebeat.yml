# Filebeat autodiscover — attaches to every running Docker container. We
# narrow to matehub-labelled ones (see services' docker-compose for the label
# scheme) so we don't ingest noise from the infra containers (redis, scylla,
# etc). For those the tracing is already sufficient; we only care about the
# 5 matehub services emitting JSON logs.
#
# JSON decoding: matehub services run with LOG_FORMAT=json, so each line of
# container stdout is already a JSON object with timestamp/level/message plus
# span fields (call_id, hub_id, request_id, ...). We ask filebeat to parse
# the `message` field (which docker wraps the app's stdout in) and hoist the
# decoded object to the top level — that way Kibana sees `call_id` as a
# first-class field without a runtime pipeline.

filebeat.autodiscover:
  providers:
    - type: docker
      # Only pick up containers explicitly labelled as matehub services.
      # Keeps the index clean and easy to reason about.
      #
      # Note: Filebeat 8.x flattens Docker label keys by translating dots to
      # underscores, so the label `matehub.service` is exposed as
      # `docker.container.labels.matehub_service`. Using the dotted form
      # silently matches nothing (Filebeat parses each dot as a nested-field
      # separator, and there's no `matehub` object in labels — only the
      # literal flattened key). Symptom: autodiscover starts, 0 inputs
      # loaded, 0 harvesters, empty ES — exactly what we hit on alpha002.
      templates:
        # We tried label-based matching first (`matehub.service` is set
        # on every matehub-* compose service). Three flavours all failed
        # silently with "Enabled inputs: 0" and no harvesters:
        #
        #   docker.container.labels.matehub.service    — dots parsed as path
        #   docker.container.labels.matehub_service    — namespace mismatch
        #   container.labels.matehub_service           — same
        #
        # Filebeat 8.15 docker autodiscover does something weird around
        # dotted label keys we couldn't pin down. Match on the compose
        # container-name prefix instead: it's `matehub-box-<service>-N`
        # for every service we care about, and `docker.container.name`
        # works cleanly in condition.
        #
        # One template entry per service so we can hard-code the `service`
        # field name without a regex/script processor (those need the JS
        # plugin which isn't always built in). Verbose but explicit.
        #
        # Trade-off: if the compose project name ever changes from
        # `matehub-box`, this stops matching. Update the prefixes below
        # if you rename the project. New service? Add an entry here too.
        - condition:
            regexp:
              docker.container.name: "^matehub-box-hub-"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - add_fields:
                    target: ""
                    fields:
                      service: hub
        - condition:
            regexp:
              docker.container.name: "^matehub-box-chat-"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - add_fields:
                    target: ""
                    fields:
                      service: chat
        - condition:
            regexp:
              docker.container.name: "^matehub-box-video-"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - add_fields:
                    target: ""
                    fields:
                      service: video
        - condition:
            regexp:
              docker.container.name: "^matehub-box-transcoder-"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - add_fields:
                    target: ""
                    fields:
                      service: transcoder
        - condition:
            regexp:
              docker.container.name: "^matehub-box-frontend-"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - add_fields:
                    target: ""
                    fields:
                      service: frontend

# Fallback for locally-run (host) services shipping to filebeat via UDP/TCP:
# uncomment if needed. Default path is docker-only.
# filebeat.inputs:
#   - type: tcp
#     host: "0.0.0.0:5044"

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  # One index per service per day. `service` comes from the add_fields
  # processor above. Keeps retention policies simple (delete by index name).
  index: "matehub-%{[service]:unknown}-%{+yyyy.MM.dd}"

# Disable Elasticsearch's template that filebeat ships by default — it
# targets index names like `filebeat-*` which we don't use.
setup.template.enabled: false
setup.ilm.enabled: false

# Less noisy logs from filebeat itself.
logging.level: info
logging.to_files: false

processors:
  # Drop the big `agent.*` / `ecs.*` boilerplate Elastic adds. The parts we
  # care about (timestamp, level, message, call_id, hub_id) are preserved.
  - drop_fields:
      fields: ["agent", "ecs", "input", "host.hostname", "log.offset", "log.file.path"]
      ignore_missing: true
