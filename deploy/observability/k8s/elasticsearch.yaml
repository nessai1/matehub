# Single-node Elasticsearch for MVP-scale logging (< 500 GB/month).
# For production at serious scale, swap to ECK (Elastic Cloud on Kubernetes)
# with a 3+ node cluster — this manifest is intentionally minimal so it
# runs on a fresh YC managed-k8s cluster without extra operators.
#
# StorageClass: `yc-network-ssd` is YC's default SSD class. On other
# providers change to gp3 (AWS), standard-rwo (GKE), managed-premium (AKS).

apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: observability
data:
  elasticsearch.yml: |
    cluster.name: matehub-logs
    network.host: 0.0.0.0
    discovery.type: single-node
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: observability
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers:
        # ES requires vm.max_map_count >= 262144 on the host. On managed k8s
        # we can't sysctl from inside, but most providers (YC included) ship
        # nodes with the right value. This init container is a guard — fails
        # loud early rather than ES crashing with an inscrutable error.
        - name: check-sysctl
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              current=$(cat /proc/sys/vm/max_map_count)
              if [ "$current" -lt 262144 ]; then
                echo "vm.max_map_count=$current, need >=262144" >&2
                echo "Ask provider to bump node sysctl" >&2
                exit 1
              fi
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms2g -Xmx2g"
          resources:
            requests:
              cpu: "500m"
              memory: "3Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          ports:
            - containerPort: 9200
              name: http
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: elasticsearch-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: yc-network-ssd
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: observability
spec:
  clusterIP: None   # headless — one-stable-hostname-per-pod for the StatefulSet
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: http
      name: http
