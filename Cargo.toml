[workspace]
resolver = "2"
members = [
    "services/video",
    "services/chat",
    "services/hub",
    "services/general",
    "services/transcoder",
    "packages/common-rust",
    "crates/matehub-rtc-client",
]
# The Tauri desktop app lives outside the workspace on purpose: it drags in
# platform capture/encode/webview deps (scap, openh264, tauri) that the
# services CI image has no business building. It has its own lockfile.
exclude = ["apps/desktop-share/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/matehub/matehub"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tonic = "0.13"
prost = "0.13"

# WebRTC (video service)
# default-features off: drops the `examples` feature (rouille web server).
# Crypto: aws-lc-rs backend — DTLS is dimpl (pure Rust), ciphers from AWS-LC.
# No OpenSSL in the tree anymore (was a str0m<=0.13 constraint).
str0m = { version = "0.21", default-features = false, features = ["aws-lc-rs"] }

# Crypto
ring = "0.17"
rustls = "0.23"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Data & coordination
redis = { version = "0.28", features = ["tokio-comp"] }
async-nats = "0.38"

# Concurrency
crossbeam = "0.8"
parking_lot = "0.12"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
axum-prometheus = "0.8"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"

# Utils
uuid = { version = "1", features = ["v4", "v5", "serde"] }
rand = "0.9"
bytes = "1"
thiserror = "2"
anyhow = "1"
futures-util = "0.3"
pretty_assertions = "1"
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
criterion = { version = "0.5", features = ["html_reports"] }
socket2 = "0.5"
if-addrs = "0.14"

# Fast WebSocket (hot-path for gateway)
fastwebsockets = { version = "0.10", features = ["upgrade", "unstable-split", "with_axum"] }

# Workspace crates
matehub-common = { path = "packages/common-rust" }

# ScyllaDB / Cassandra
scylla = "1"

# Snowflake IDs
sonyflake = "0.2"
dotenvy = "0.15"

# S3 (Yandex Object Storage / MinIO / AWS)
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
