name: Release

# Per-service release: build & push a single image to Yandex CR.
#
# Trigger: git tag of the form <service>/<version>, e.g.
#   git tag video/0.0.2 && git push --tags
#
# Result: cr.yandex/<YC_REGISTRY_ID>/matehub-video:0.0.2
#
# This workflow does NOT deploy. Deploy lives in deploy.yml (workflow_dispatch
# with environment gating). Releasing an image and rolling it out are kept
# separate on purpose -- a tag means "image is ready", not "ship to prod".

on:
  push:
    tags:
      - 'hub/*'
      - 'chat/*'
      - 'video/*'
      - 'transcoder/*'
      - 'general/*'
      # `box/vX.Y.Z` triggers the box archive build instead of an image
      # push -- see the second job below. Kept in the same workflow so a
      # single tag of the right shape produces a publishable artifact.
      - 'box/v*'

env:
  REGISTRY: cr.yandex

jobs:
  build-push:
    name: Build & push
    runs-on: ubuntu-latest
    # Per-service tags only -- box/* tags hit the build-box-archives job
    # below instead.
    if: ${{ !startsWith(github.ref_name, 'box/') }}

    steps:
      - uses: actions/checkout@v4

      # ── Parse tag: video/0.0.2 -> service=video, version=0.0.2 ──────
      # Reject anything that isn't a known service name + a semver-ish
      # version. Saves us from accidental tags like `video/wip` ending
      # up in the registry.
      - name: Parse tag
        id: parse
        run: |
          REF="${GITHUB_REF_NAME}"
          SERVICE="${REF%%/*}"
          VERSION="${REF#*/}"

          case "$SERVICE" in
            hub|chat|video|transcoder|general) ;;
            *) echo "::error::unknown service '$SERVICE' in tag '$REF'"; exit 1 ;;
          esac

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not semver (X.Y.Z[-pre])"
            exit 1
          fi

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/matehub-$SERVICE:$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $SERVICE @ $VERSION"

      # ── Refuse to release if the tag isn't on main ──────────────────
      # Tags on feature branches happen by accident; releasing them
      # silently is exactly the kind of bug that takes a week to trace.
      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.rust
          target: ${{ steps.parse.outputs.service }}
          # SERVICE arg tells the Rust builder which crate to compile.
          # Must match `target` -- mismatched values fail loudly at copy
          # time ("matehub-X not found"), which is desired.
          # VERSION flows into MATEHUB_VERSION env so /version reports
          # the same tag the image was published under.
          build-args: |
            SERVICE=${{ steps.parse.outputs.service }}
            VERSION=${{ steps.parse.outputs.version }}
          push: true
          tags: ${{ steps.parse.outputs.image }}
          # Cache scoped per service so video's cache doesn't evict hub's.
          cache-from: type=gha,scope=${{ steps.parse.outputs.service }}
          cache-to:   type=gha,scope=${{ steps.parse.outputs.service }},mode=max

      - name: Summary
        run: |
          echo "### Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${{ steps.parse.outputs.service }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.parse.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.parse.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────
  # Box archive build (`box/vX.Y.Z` tags)
  #
  # Resolves the latest `<service>/X.Y.Z` tag for each service, packs
  # three Linux-family-flavoured tarballs (debian/ubuntu/rhel — content
  # is the same today, distinct names for delivery), and attaches them
  # as assets on the matching GitHub Release.
  #
  # Required repo secrets:
  #   YC_PULLER_KEY — a Yandex Cloud SA key file (raw JSON, not base64)
  #                   for an SA holding only `container-registry.images.puller`.
  #                   This is what end-users authenticate with from inside
  #                   the archive; an admin/push key here would be a
  #                   serious leak vector.
  # ─────────────────────────────────────────────────────────────────────

  build-box-archives:
    name: Box archive (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref_name, 'box/') }}
    permissions:
      # Required by softprops/action-gh-release to create / update the
      # release and attach assets.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [debian, ubuntu, rhel]
    steps:
      - uses: actions/checkout@v4
        with:
          # The pack script resolves image versions from per-service git
          # tags via `git tag --sort=-v:refname`. fetch-depth=0 makes
          # them all visible.
          fetch-depth: 0

      - name: Resolve archive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#box/}" >> "$GITHUB_OUTPUT"

      - name: Materialise puller.json from secret
        run: |
          mkdir -p /tmp/secrets
          # The secret is the raw JSON SA key file as exported by `yc iam
          # key create`. Don't try to be clever with base64 encoding --
          # GitHub's secret store handles multi-line values fine.
          printf '%s' "${{ secrets.YC_PULLER_KEY }}" > /tmp/secrets/puller.json
          chmod 0600 /tmp/secrets/puller.json
          # Quick shape check so a missing/empty secret fails fast with a
          # clear message instead of crashing pack-box-archive.sh.
          jq -e '.id and .service_account_id and .private_key' /tmp/secrets/puller.json > /dev/null \
            || { echo "::error::YC_PULLER_KEY is missing or malformed"; exit 1; }

      - name: Pack archive
        run: |
          ./scripts/pack-box-archive.sh \
            --variant ${{ matrix.variant }} \
            --version ${{ steps.ver.outputs.version }} \
            --puller /tmp/secrets/puller.json \
            --out dist

      # Tag is `box/vX.Y.Z`. softprops creates the release on the tag
      # (or updates it) and uploads files from the matching glob. Each
      # matrix variant uploads its own tarball to the same release in
      # parallel.
      #
      # noinspection YAMLSchemaValidation -- IntelliJ's bundled GH Actions
      # schema doesn't index third-party action inputs; `files` is a
      # valid input on softprops/action-gh-release@v2.
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/matehub-box-${{ matrix.variant }}-*.tar.gz

      - name: Summary
        run: |
          {
            echo "### Box archive — ${{ matrix.variant }}"
            echo
            echo "- Tag:     \`${{ github.ref_name }}\`"
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Asset:   \`matehub-box-${{ matrix.variant }}-${{ steps.ver.outputs.version }}.tar.gz\`"
          } >> "$GITHUB_STEP_SUMMARY"
