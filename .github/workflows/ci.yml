name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: cr.yandex
  # Set in GitHub repo secrets: YC_REGISTRY_ID, YC_SA_KEY

jobs:
  # ──────────────────────────────────────────────
  # Rust: check, test, clippy
  # ──────────────────────────────────────────────
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  # ──────────────────────────────────────────────
  # TypeScript: lint, typecheck
  # ──────────────────────────────────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run typecheck

  # ──────────────────────────────────────────────
  # Build & push Docker images (only on main)
  # ──────────────────────────────────────────────
  build-images:
    name: Build & Push Images
    needs: [rust-check, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: video
            dockerfile: deploy/docker/Dockerfile.video
          - name: chat
            dockerfile: deploy/docker/Dockerfile.chat
          - name: general
            dockerfile: deploy/docker/Dockerfile.general
          - name: frontend
            dockerfile: deploy/docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/matehub-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/matehub-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Update image tags in Helm values (GitOps trigger)
  # ──────────────────────────────────────────────
  update-deploy:
    name: Update Deploy Manifest
    needs: [build-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        run: |
          cd deploy/helm/matehub
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" values-staging.yaml

      - name: Commit updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/matehub/values-staging.yaml
          git diff --cached --quiet || git commit -m "deploy: update staging images to ${{ github.sha }}"
          git push
